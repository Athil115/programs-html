<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Website</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:linear-gradient(-45deg,#6e035328,#053acc,#9a9c1065,#d8db07da);
            background-size:400% 400%;
            animation:bgAnimation 10s ease infinite;
        }

        @keyframes bgAnimation{
            0%{background-position:0% 50%;}
            50%{background-position:100% 50%;}
            100%{background-position:0% 50%;}
        }

        .card{
            width:400px;
            padding:40px;
            text-align:center;
            border-radius:20px;
            background:rgba(224, 124, 10, 0.15);
            backdrop-filter:blur(10px);
            -webkit-backdrop-filter:blur(10px);
            color:rgba(153, 11, 219, 0.795);
            box-shadow:0 8px 30px rgba(0, 0, 0, 0.3);
            animation:fadeIn 2s;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(40px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        h1{
            font-size:40px;
            text-shadow:0 0 20px rgba(238, 6, 141, 0.678);
            animation:glow 2s infinite alternate;
        }

        @keyframes glow{
            from{
                text-shadow:0 0 10px rgba(51, 255, 0, 0.363);
            }
            to{
                text-shadow:0 0 30px rgb(178, 226, 4);
            }
        }

        p{
            margin:20px 0;
            font-size:18px;
        }

        button{
            padding:15px 35px;
            border:none;
            border-radius:30px;
            background:#2e200ee5;
            color:rgba(3, 160, 199, 0.658);
            font-size:18px;
            cursor:pointer;
            transition:0.4s;
        }

        button:hover{
            transform:scale(1.1);
            background:rgb(119, 204, 9);
        }

        #message{
            margin-top:20px;
            font-size:22px;
            color:#66cfff;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Welcome</h1>

        <p>Professional Animated HTML Website</p>

        <button onclick="showMessage()">Click Me</button>

        <h2 id="message"></h2>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
            "🎉 Welcome to Web Development!";
        }
    </script>

</body>
</html>
